# Prüfkette für jeden Pull Request und jeden Stand auf main.
#
# Alle Actions sind auf einen Commit-SHA festgenagelt, nicht auf einen
# beweglichen Tag. Jeder Job bekommt ausdrücklich die kleinstmöglichen Rechte.
# gitleaks und semgrep laufen zusätzlich zu Secret Scanning und CodeQL:
# sie prüfen jeden Pull Request unabhängig von den GitHub-Diensten.

name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen-und-pruefen:
    name: Bauen, Typen, Lint, Header
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quellcode holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: kein Paket im Baum darf beim Installieren Code
      # ausführen. Geprüft, dass Lint, Typen, Build und alle Prüfungen ohne
      # Installationsskripte durchlaufen.
      - name: Abhängigkeiten aus dem Lockfile installieren
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bauen, inklusive Abgleich der CSP-Hashes
        run: npm run build

      - name: Ausgelieferte Bilder auf Metadaten prüfen
        run: npm run pruefe:bilder

      - name: Bekannte Schwachstellen in Abhängigkeiten
        run: npm audit --audit-level=high

      - name: Stückliste im CycloneDX-Format erzeugen
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cdx.json

      - name: Stückliste als Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      # Server und Prüfungen in einem Schritt: ein zwischen zwei Schritten
      # weiterlaufender Hintergrundprozess ist kein verlässlicher Zustand.
      - name: Ausgelieferte Seiten prüfen
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SEITEN: >-
            / /about /kontakt /nis2-nisg-2026 /nis2-nisg-2026/betroffenheit-pruefen
            /iso-27001 /security-services /referenzen
            /impressum /datenschutz /barrierefreiheit
            /nis2-nisg-2026/fristen-und-registrierung
            /nis2-nisg-2026/haftung-der-geschaeftsfuehrung
            /nis2-nisg-2026/lieferkette-und-fragebogen
            /iso-27001/ablauf-der-zertifizierung /iso-27001/interne-audits
        run: |
          npx next start -p 3000 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:3000/ || {
            echo "Server ist nicht hochgekommen."; exit 1;
          }
          node scripts/pruefe-header.mjs http://127.0.0.1:3000 $SEITEN
          node scripts/pruefe-barrierefreiheit.mjs http://127.0.0.1:3000 $SEITEN
          node scripts/pruefe-abnahme.mjs http://127.0.0.1:3000

      - name: Monatsbericht erzeugt einen Beispielbericht
        run: node scripts/analytics-report.ts --beispiel

  geheimnisse:
    name: Suche nach Zugangsdaten im Verlauf
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quellcode mit vollständigem Verlauf holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks holen und Prüfsumme vergleichen
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Verlauf durchsuchen
        run: ./gitleaks git --no-banner --redact --exit-code 1 .

  code-analyse:
    name: Statische Analyse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quellcode holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: semgrep installieren
        run: pipx install semgrep==1.145.0

      - name: Regelwerke anwenden
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --error \
            --metrics off \
            --exclude node_modules \
            --exclude .next

  lighthouse:
    # Nur Bericht, keine Sperre: Gemessen wird gegen den lokalen Server in der
    # CI, ohne CDN und ohne HTTP/2. Die verbindliche Messung für die Abnahme
    # (Kriterium 1) findet am Produktions-Deployment statt. Die Zahlen hier
    # zeigen Trends und liefern die Grundlage für die Entscheidung W2.
    name: Lighthouse (Bericht)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quellcode holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren und bauen
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Drei Seiten messen (mobil)
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 0.5; done
          mkdir -p lighthouse
          for pfad in / /nis2-nisg-2026 /nis2-nisg-2026/fristen-und-registrierung; do
            name=$(echo "$pfad" | tr '/' '_' | sed 's/^_$/start/; s/^_//')
            npx --yes lighthouse@13.4.1 "http://127.0.0.1:3000$pfad" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output=html --output-path="lighthouse/$name" --quiet || true
          done
          node -e '
            const fs=require("fs");
            const zeilen=["| Seite | Performance | Barrierefreiheit | Best Practices | SEO |","|---|---:|---:|---:|---:|"];
            for (const f of fs.readdirSync("lighthouse").filter(f=>f.endsWith(".report.json"))) {
              const r=JSON.parse(fs.readFileSync("lighthouse/"+f,"utf8")); const c=r.categories;
              const w=k=>Math.round((c[k]?.score??0)*100);
              zeilen.push(`| ${new URL(r.finalDisplayedUrl).pathname} | ${w("performance")} | ${w("accessibility")} | ${w("best-practices")} | ${w("seo")} |`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Lighthouse (lokal in der CI, mobil)\n\n"+zeilen.join("\n")+"\n");
            console.log(zeilen.join("\n"));'

      - name: Berichte ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: lighthouse/
          retention-days: 30
