# Prüfkette für jeden Pull Request und jeden Stand auf main.
#
# Alle Actions sind auf einen Commit-SHA festgenagelt, nicht auf einen
# beweglichen Tag. Jeder Job bekommt ausdrücklich die kleinstmöglichen Rechte.
# gitleaks und semgrep laufen zusätzlich zu Secret Scanning und CodeQL:
# sie prüfen jeden Pull Request unabhängig von den GitHub-Diensten.

name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen-und-pruefen:
    name: Bauen, Typen, Lint, Header
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quellcode holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten aus dem Lockfile installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typen prüfen
        run: npm run typecheck

      - name: Bauen, inklusive Abgleich der CSP-Hashes
        run: npm run build

      - name: Bekannte Schwachstellen in Abhängigkeiten
        run: npm audit --audit-level=high

      - name: Stückliste im CycloneDX-Format erzeugen
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cdx.json

      - name: Stückliste als Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      - name: Server starten und Header prüfen
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 0.5
          done
          node scripts/pruefe-header.mjs http://127.0.0.1:3000 /

  geheimnisse:
    name: Suche nach Zugangsdaten im Verlauf
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quellcode mit vollständigem Verlauf holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks holen und Prüfsumme vergleichen
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Verlauf durchsuchen
        run: ./gitleaks git --no-banner --redact --exit-code 1 .

  code-analyse:
    name: Statische Analyse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quellcode holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: semgrep installieren
        run: pipx install semgrep==1.145.0

      - name: Regelwerke anwenden
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --error \
            --metrics off \
            --exclude node_modules \
            --exclude .next
