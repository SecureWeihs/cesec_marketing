# Laufende Prüfung nach Abschnitt 14.6 des Briefs: nach jedem erfolgreichen
# Produktions-Deployment gegen die echte Domain. Vercel meldet Deployments
# über die GitHub-Deployment-API; diese Prüfung hängt sich daran.

name: Produktion prüfen

on:
  deployment_status:
  workflow_dispatch:

permissions: {}

jobs:
  produktion:
    name: Produktion gegen die Vorgaben prüfen
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ZIEL: https://cesec.at
    steps:
      - name: Quellcode holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      # Der Abruf braucht ein Zeitlimit und stdin aus /dev/null: Ohne beides
      # kann s_client auf einem Runner hängen bleiben, statt zu antworten.
      # Kurz nach einem Deployment ist das Zertifikat außerdem manchmal noch
      # nicht ausgeliefert, deshalb bis zu fünf Versuche.
      - name: Zertifikat gültig und nicht kurz vor Ablauf
        run: |
          for versuch in 1 2 3 4 5; do
            if timeout 20 openssl s_client -servername cesec.at -connect cesec.at:443 \
                 </dev/null 2>/dev/null | openssl x509 -noout -checkend 1209600; then
              echo "Zertifikat gültig und mindestens 14 Tage haltbar."
              exit 0
            fi
            echo "Versuch $versuch: kein verwertbares Zertifikat erhalten."
            sleep 10
          done
          echo "Zertifikat ungültig, nicht erreichbar oder läuft in weniger als 14 Tagen ab."
          exit 1

      # Prüft zusätzlich, dass das Zertifikat www abdeckt: Ohne die Domain im
      # Vercel-Projekt zeigt der DNS-Eintrag zwar hin, der Handshake scheitert
      # aber mit einer Zertifikatswarnung — für Besucher schlimmer als gar kein
      # www.
      - name: www leitet dauerhaft auf den kanonischen Host
        run: |
          antwort=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 https://www.cesec.at/) || {
            echo "https://www.cesec.at ist nicht erreichbar — fehlt die Domain im Vercel-Projekt?"
            exit 1
          }
          echo "$antwort"
          case "$antwort" in 301\ https://cesec.at/*|308\ https://cesec.at/*) ;; *) exit 1 ;; esac

      - name: Header, CSP und Fremd-Hosts auf allen Seiten der Sitemap
        run: |
          SEITEN=$(curl -s "$ZIEL/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's#<loc>https://cesec.at##; s#</loc>##; s#^$#/#')
          node scripts/pruefe-header.mjs "$ZIEL" $SEITEN

      - name: Abnahmekriterien
        run: node scripts/pruefe-abnahme.mjs "$ZIEL"

  lighthouse:
    # Misst die echte Auslieferung: über HTTPS, mit CDN und HTTP/2. Nur hier
    # sind die Zahlen für Abnahmekriterium 1 aussagekräftig — im Pull Request
    # würde derselbe Lauf den bereits veröffentlichten Stand messen, nicht die
    # Änderung.
    name: Lighthouse an der Produktion
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quellcode holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Drei Seiten messen (mobil)
        env:
          npm_config_ignore_scripts: "true"
        run: |
          mkdir -p lighthouse
          for pfad in / /nis2-nisg-2026 /nis2-nisg-2026/fristen-und-registrierung; do
            name=$(echo "$pfad" | tr '/' '_' | sed 's/^_$/start/; s/^_//')
            npx --yes lighthouse@13.4.1 "https://cesec.at$pfad" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output=html --output-path="lighthouse/$name" --quiet
          done

      - name: Ergebnis bewerten
        run: |
          node -e '
            const fs = require("fs");
            const zeilen = ["| Seite | Performance | Barrierefreiheit | Best Practices | SEO |", "|---|---:|---:|---:|---:|"];
            let fehler = [];
            for (const datei of fs.readdirSync("lighthouse").filter((f) => f.endsWith(".report.json"))) {
              const bericht = JSON.parse(fs.readFileSync("lighthouse/" + datei, "utf8"));
              const c = bericht.categories;
              const wert = (k) => Math.round((c[k]?.score ?? 0) * 100);
              const pfad = new URL(bericht.finalDisplayedUrl).pathname;
              zeilen.push(`| ${pfad} | ${wert("performance")} | ${wert("accessibility")} | ${wert("best-practices")} | ${wert("seo")} |`);
              // Abnahmekriterium 1 verlangt überall 100. Bei der Performance
              // schwankt die Messung über das Netz, deshalb greift dort erst
              // eine Untergrenze — die drei anderen müssen sitzen.
              for (const k of ["accessibility", "best-practices", "seo"]) {
                if (wert(k) < 100) fehler.push(`${pfad}: ${k} ${wert(k)}, erwartet 100`);
              }
              if (wert("performance") < 90) fehler.push(`${pfad}: Performance ${wert("performance")}, Untergrenze 90`);
            }
            const tabelle = "## Lighthouse an der Produktion (mobil)\n\n" + zeilen.join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, tabelle);
            console.log(tabelle);
            if (fehler.length) { console.error("Unterschritten:\n  " + fehler.join("\n  ")); process.exit(1); }
          '

      - name: Berichte ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-produktion
          path: lighthouse/
          retention-days: 90
